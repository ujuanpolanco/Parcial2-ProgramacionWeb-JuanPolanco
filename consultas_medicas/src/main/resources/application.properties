spring.application.name=consultas_medicas

# Puerto 8081 para no chocar con el Tomcat de Eclipse (8080)
server.port=8081

# ===== Base de datos: PostgreSQL =====
# Las tablas y los datos se crean con los scripts de la carpeta sql/
spring.datasource.url=jdbc:postgresql://localhost:5432/consultas_medicas
spring.datasource.username=postgres
spring.datasource.password=1234

# JPA / Hibernate
# none = Hibernate no toca las tablas (ya las crean los scripts SQL)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Vistas JSP
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# No mostrar el detalle técnico (stack trace) en las respuestas de error
server.error.include-stacktrace=never
